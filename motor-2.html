<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motores</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 20px 16px 60px; max-width: 640px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  p.n { margin: 0 0 14px; opacity: .7; font-size: 14px; }
  button { font: inherit; padding: 9px 16px; border: 1px solid currentColor; background: transparent;
           color: inherit; border-radius: 6px; cursor: pointer; margin: 0 8px 8px 0; }
  button:disabled { opacity: .4; cursor: default; }
  #estado { font: 14px/1.4 system-ui, sans-serif; margin: 14px 0 0; min-height: 22px; font-weight: 600; }
  pre { font: 12.5px/1.45 ui-monospace, monospace; white-space: pre; overflow-x: auto;
        border-left: 3px solid; padding: 8px 12px; margin: 8px 0 0; }
  pre#detalle { white-space: pre-wrap; word-break: break-word; opacity: .8; font-size: 12px; }
</style>

<h1>Motores</h1>
<p class="n">Misma posición de medio juego en todos. La referencia a batir es 6148 ms a profundidad 13.</p>

<button id="propio">Probar el del repo</button>
<button id="cdn">Probar los del CDN</button>

<p id="estado">Listo para empezar.</p>
<pre id="tabla">—</pre>
<pre id="detalle"></pre>

<script>
const $ = id => document.getElementById(id);
const ms = t => Math.round(performance.now() - t);
const detalle = [];
const verDetalle = () => { $("detalle").textContent = detalle.join("\n"); };

let baseEstado = "", desde = 0, reloj = null;
function estado(txt, conReloj) {
  baseEstado = txt; clearInterval(reloj); $("estado").textContent = txt;
  if (conReloj) {
    desde = performance.now();
    reloj = setInterval(() => {
      $("estado").textContent = baseEstado + " (" + Math.round(ms(desde) / 1000) + " s)";
    }, 500);
  }
}

const FEN = "r2qk2r/pppb1ppp/2n1pn2/2bp4/3P4/1QN1P2N/PP2BPPP/R1B1K2R w KQkq - 0 9";
const ESPERADO = "d4c5";
const REFERENCIA = 6148;

/* modo "directo": Worker de una dirección real, como el motor espera.
   modo "envuelto": importScripts desde un blob, única opción para un CDN. */
const PROPIO = [{
  nombre: "SF 18 propio", modo: "directo", url: "./stockfish-18-lite-single.js",
  peso: "7,3 MB de tu repo", profundidades: [13, 16, 18]
}];
const CDN = [
  { nombre: "SF 10 asm", modo: "envuelto", base: "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/",
    archivo: "stockfish.js", peso: "1,5 MB", profundidades: [13] },
  { nombre: "SF 18 unpkg", modo: "envuelto", base: "https://unpkg.com/stockfish@18.0.8/bin/",
    archivo: "stockfish-18-lite-single.js", peso: "7,3 MB", profundidades: [13] }
];

function envoltorio(base, archivo) {
  return [
    'var BASE=' + JSON.stringify(base) + ';',
    'var antes=Object.keys(self);',
    'self.onerror=function(e){postMessage("DIAG onerror: "+(e.message||e));};',
    'self.addEventListener("unhandledrejection",function(e){',
    '  postMessage("DIAG promesa rechazada: "+((e.reason&&e.reason.message)||e.reason));});',
    'var Module={locateFile:function(f){return BASE+f;}};',
    'try{importScripts(BASE+' + JSON.stringify(archivo) + ');}',
    'catch(e){postMessage("FATAL no cargó: "+e.message);}',
    'postMessage("DIAG globales nuevos: "+Object.keys(self).filter(function(k){',
    '  return antes.indexOf(k)<0;}).join(" ")||"(ninguno)");',
    'var fab=self.Stockfish||self.STOCKFISH;',
    'if(typeof fab==="function"){',
    '  try{Promise.resolve(fab()).then(function(sf){',
    '    if(sf.addMessageListener)sf.addMessageListener(function(m){postMessage(m);});',
    '    else sf.onmessage=function(m){postMessage(m.data||m);};',
    '    self.onmessage=function(e){sf.postMessage(e.data);};',
    '    postMessage("DIAG arrancó por fábrica");',
    '  }).catch(function(e){postMessage("FATAL init: "+e.message);});}',
    '  catch(e){postMessage("FATAL fábrica: "+e.message);}',
    '} else { postMessage("DIAG arrancó por instalación propia"); }'
  ].join("\n");
}

function abrir(m) {
  const w = m.modo === "directo"
    ? new Worker(m.url)
    : new Worker(URL.createObjectURL(
        new Blob([envoltorio(m.base, m.archivo)], { type: "application/javascript" })));
  const oyentes = [];
  const crudos = [];
  w.onmessage = ev => {
    const d = ev.data;
    const s = typeof d === "string" ? d : String((d && d.data) || d);
    if (crudos.length < 30) crudos.push(s);
    oyentes.slice().forEach(f => f(s));
  };
  w.onerror = e => {
    const s = "FATAL worker: " + (e.message || "error sin mensaje");
    crudos.push(s);
    oyentes.slice().forEach(f => f(s));
  };
  return {
    crudos,
    enviar: c => w.postMessage(c),
    espiar: fn => oyentes.push(fn),
    esperar: (pref, tope) => new Promise((ok, no) => {
      const id = setTimeout(() => { sacar(); no(new Error("agotó los " + tope / 1000 + " s esperando " + pref)); }, tope);
      const fn = s => {
        if (s.startsWith("FATAL")) { clearTimeout(id); sacar(); no(new Error(s.slice(6))); }
        else if (s.startsWith(pref)) { clearTimeout(id); sacar(); ok(s); }
      };
      const sacar = () => { const i = oyentes.indexOf(fn); if (i >= 0) oyentes.splice(i, 1); };
      oyentes.push(fn);
    }),
    cerrar: () => w.terminate()
  };
}

/* El wasm sigue compilando después de arrancar y se pierde lo que se mande
   mientras tanto, así que se repite "uci" hasta que conteste. */
function despertar(sf, tope) {
  return new Promise((ok, no) => {
    const t0 = performance.now();
    let vivo = true;
    sf.espiar(s => {
      if (!vivo) return;
      if (s.startsWith("uciok")) { vivo = false; clearInterval(pulso); ok(ms(t0)); }
      else if (s.startsWith("FATAL")) { vivo = false; clearInterval(pulso); no(new Error(s.slice(6))); }
    });
    sf.enviar("uci");
    const pulso = setInterval(() => {
      if (!vivo) return;
      if (ms(t0) > tope) { vivo = false; clearInterval(pulso); no(new Error("el motor nunca contestó (" + tope / 1000 + " s)")); }
      else sf.enviar("uci");
    }, 750);
  });
}

async function probar(m) {
  const fila = { nombre: m.nombre, carga: null, tiempos: {}, jugada: "", error: null };
  let sf = null;
  try {
    estado(`${m.nombre}: bajando ${m.peso}`, true);
    const t0 = performance.now();
    sf = abrir(m);
    let nombreMotor = "";
    sf.espiar(s => {
      if (s.startsWith("id name") && !nombreMotor) nombreMotor = s.slice(8);
      if (s.startsWith("DIAG")) { detalle.push("  " + s.slice(5)); verDetalle(); }
    });

    estado(`${m.nombre}: compilando y despertando el motor`, true);
    await despertar(sf, 120000);
    fila.carga = ms(t0);
    detalle.push(`${m.nombre}: despierto a los ${fila.carga} ms — ${nombreMotor || "sin nombre"}`);
    verDetalle(); pintarTabla();

    for (const prof of m.profundidades) {
      estado(`${m.nombre}: analizando a profundidad ${prof}`, true);
      sf.enviar("ucinewgame");
      sf.enviar("position fen " + FEN);
      const t = performance.now();
      const esp = sf.esperar("bestmove", 120000);
      sf.enviar("go depth " + prof);
      const best = await esp;
      const dur = ms(t);
      fila.tiempos[prof] = dur;
      if (prof === 13) fila.jugada = best.split(" ")[1] || "?";
      pintarTabla();
      if (dur > 15000) { detalle.push("  corto acá, muy lento"); verDetalle(); break; }
    }
  } catch (e) {
    fila.error = e.message;
    detalle.push(`${m.nombre}: ${e.message}`);
    if (sf && sf.crudos.length) {
      detalle.push("  lo que dijo el motor:");
      sf.crudos.slice(0, 12).forEach(c => detalle.push("    " + c.slice(0, 160)));
    } else {
      detalle.push("  el motor no dijo absolutamente nada");
    }
    verDetalle();
  }
  if (sf) sf.cerrar();
  return fila;
}

let FILAS = [], PROFS = [13, 16, 18];
function pintarTabla() {
  const col = (s, n) => String(s).padEnd(n);
  const der = (s, n) => String(s).padStart(n);
  const cab = col("motor", 14) + der("arranque", 11) + PROFS.map(p => der("prof " + p, 10)).join("") + "  jugada";
  const filas = FILAS.map(f => {
    if (f.carga == null) return col(f.nombre, 14) + "  no funcionó";
    return col(f.nombre, 14) + der(f.carga + " ms", 11)
      + PROFS.map(p => der(f.tiempos[p] != null ? f.tiempos[p] + " ms" : "—", 10)).join("")
      + "  " + (f.jugada ? f.jugada + (f.jugada === ESPERADO ? " ✓" : " ✗") : "");
  });
  $("tabla").textContent = [cab, "".padEnd(cab.length, "─"), ...filas].join("\n");
}

async function correr(lista) {
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  FILAS = []; detalle.length = 0; verDetalle(); pintarTabla();
  for (const m of lista) { FILAS.push(await probar(m)); pintarTabla(); }
  clearInterval(reloj);

  const buenos = FILAS.filter(f => f.tiempos[13]);
  if (buenos.length) {
    const mejor = buenos.reduce((a, b) => a.tiempos[13] <= b.tiempos[13] ? a : b);
    const t13 = mejor.tiempos[13];
    detalle.push("");
    detalle.push(`Más rápido: ${mejor.nombre}, ${t13} ms a profundidad 13 (${(REFERENCIA / t13).toFixed(1)}× la referencia).`);
    detalle.push(`Con ese: 40 jugadas ≈ ${(t13 * 40 / 1000).toFixed(0)} s · un mes de 13 partidas ≈ ${(t13 * 40 * 13 / 60000).toFixed(1)} min.`);
    verDetalle();
    $("estado").textContent = `Terminó todo. Funcionaron ${buenos.length} de ${FILAS.length}.`;
  } else {
    $("estado").textContent = "Terminó todo. Ninguno funcionó.";
  }
  document.querySelectorAll("button").forEach(b => b.disabled = false);
}

$("propio").onclick = () => correr(PROPIO);
$("cdn").onclick = () => correr(CDN);
</script>
</html>
