<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Analizador de partidas</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; max-width: 700px; }
</style>
<p id="msj">Yendo al <a href="./">analizador</a>…</p>
<script>
  /* Redirect de compatibilidad. La aplicación se mudó a index.html en la v0.37;
     esto queda porque vivió acá muchas versiones y puede estar guardada así en
     el teléfono de alguien.

     El guardia no es paranoia, cubre un caso real: quien tenga en caché el
     index.html VIEJO —el que redirigía acá— entra en un bucle, porque ese index
     manda acá y esto manda a la raíz. Con la marca en sessionStorage el rebote
     pasa una sola vez y después queda el enlace a mano, en vez de una pantalla
     que parpadea sola.

     Va en JavaScript y no en un meta refresh justamente para poder poner el
     guardia; la aplicación necesita JavaScript igual. */
  (function () {
    try {
      if (sessionStorage.getItem("rebote")) {
        document.getElementById("msj").innerHTML =
          'El analizador ahora vive en <a href="./">la ra&iacute;z</a>. Si al abrirlo ' +
          "te trae de vuelta ac&aacute;, tu navegador tiene guardada una versi&oacute;n " +
          "vieja: recarg&aacute; manteniendo apretado el bot&oacute;n de recargar.";
        return;
      }
      sessionStorage.setItem("rebote", "1");
    } catch (e) { /* incógnito: sin marca, pero el redirect igual va */ }
    location.replace("./");
  })();
</script>
