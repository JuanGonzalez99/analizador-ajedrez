<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analizador de partidas</title>
<style>
  :root {
    color-scheme: light dark;
    --linea: color-mix(in srgb, currentColor 22%, transparent);
    --tenue: color-mix(in srgb, currentColor 60%, transparent);
    --claro: #e8e2d4; --oscuro: #a08b6a;
    --malo: #c0392b; --regular: #b8860b; --bien: #2e7d32;
  }
  * { box-sizing: border-box; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 18px 14px 70px; max-width: 720px; }
  h1 { font-size: 21px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 26px 0 4px; }
  p.n { margin: 0 0 12px; color: var(--tenue); font-size: 14px; }
  p.cap { margin: 10px 0 4px; font-size: 13px; color: var(--tenue); }
  button { font: inherit; padding: 9px 15px; border: 1px solid currentColor; background: transparent;
           color: inherit; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  button.chico { padding: 5px 10px; font-size: 14px; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--linea);
    border-radius: 6px; background: transparent; color: inherit; max-width: 100%; }
  input#usuario { width: 150px; }
  textarea { width: 100%; height: 90px; font: 12px/1.4 ui-monospace, monospace; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #estado { font-weight: 600; font-size: 14px; margin: 14px 0 0; min-height: 22px; }
  .barra { height: 4px; background: var(--linea); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .barra > i { display: block; height: 100%; background: currentColor; width: 0; transition: width .15s; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin-top: 6px; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  th:first-child, td:first-child, th.izq, td.izq { text-align: left; }
  tbody tr.sel { outline: 2px solid currentColor; }
  tbody tr.jugable { cursor: pointer; }
  td.senal { white-space: normal; font-size: 12.5px; color: var(--tenue); text-align: left; }
  .grave { color: var(--malo); font-weight: 700; }
  .error { color: var(--malo); }
  .impre { color: var(--regular); }
  .lista { border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; margin-top: 8px; }
  .lista > div { padding: 9px 11px; border-bottom: 1px solid var(--linea); cursor: pointer; font-size: 14px; }
  .lista > div:last-child { border-bottom: 0; }
  .lista > div.sel { font-weight: 700; }
  .oculto { display: none; }
  #tablero { margin-top: 10px; }
  svg.tab { width: 100%; max-width: 340px; height: auto; display: block; }
  .leyenda { font-size: 13px; color: var(--tenue); margin-top: 6px; }
</style>

<h1>Analizador de partidas</h1>
<p class="n">Busca partidas de chess.com y las analiza con Stockfish en tu propio navegador.
  Nada sale de tu teléfono salvo el pedido de las partidas.</p>

<div class="fila">
  <input id="usuario" placeholder="usuario de chess.com" spellcheck="false" autocapitalize="off">
  <button id="buscar">Buscar</button>
  <button id="verPegar" class="chico">o pegar un PGN</button>
</div>

<div id="zonaPegar" class="oculto" style="margin-top:10px">
  <textarea id="pgn" placeholder="Pegá acá el PGN de una partida"></textarea>
  <div class="fila" style="margin-top:6px"><button id="usarPgn" class="chico">Usar este PGN</button></div>
</div>

<div id="zonaMeses" class="oculto">
  <h2>Mes</h2>
  <select id="meses"></select>
</div>

<div id="zonaPartidas" class="oculto">
  <h2>Partida</h2>
  <div id="partidas" class="lista"></div>
</div>

<div id="zonaAnalizar" class="oculto">
  <h2>Análisis</h2>
  <div class="fila">
    <label>Profundidad
      <select id="prof">
        <option value="13">13 — rápida</option>
        <option value="16" selected>16 — recomendada</option>
        <option value="18">18 — lenta</option>
      </select>
    </label>
    <button id="analizar">Analizar</button>
  </div>
  <p id="estado"></p>
  <div class="barra"><i id="progreso"></i></div>
</div>

<div id="zonaResultado" class="oculto">
  <h2>Resumen</h2>
  <p class="cap" id="capResumen"></p>
  <table id="resumen"></table>

  <h2>Jugada por jugada</h2>
  <p class="cap">Una fila por jugada de la partida. Tocá cualquiera para ver la posición.</p>
  <div id="tablero"></div>
  <table id="jugadas"></table>
</div>

<script type="module">
import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.js";

const $ = id => document.getElementById(id);
const ver = (id, si) => $(id).classList.toggle("oculto", !si);
const estado = t => { $("estado").textContent = t; };
const progreso = f => { $("progreso").style.width = Math.round(f * 100) + "%"; };

/* ============ motor ============ */
const motor = {
  w: null, oyentes: [],
  async arrancar() {
    if (this.w) return;
    this.w = new Worker("./stockfish-18-lite-single.js");
    this.w.onmessage = ev => {
      const d = ev.data;
      const s = typeof d === "string" ? d : String((d && d.data) || d);
      this.oyentes.slice().forEach(f => f(s));
    };
    /* el wasm sigue compilando un rato: se repite uci hasta que conteste */
    await new Promise((ok, no) => {
      const t0 = Date.now();
      const fn = s => { if (s.startsWith("uciok")) { quitar(); clearInterval(p); ok(); } };
      const quitar = () => { const i = this.oyentes.indexOf(fn); if (i >= 0) this.oyentes.splice(i, 1); };
      this.oyentes.push(fn);
      this.w.postMessage("uci");
      const p = setInterval(() => {
        if (Date.now() - t0 > 120000) { quitar(); clearInterval(p); no(new Error("el motor no arrancó")); }
        else this.w.postMessage("uci");
      }, 700);
    });
    this.w.postMessage("setoption name MultiPV value 1");
  },
  /* devuelve { cp, mate, mejor } visto por el que tiene el turno */
  analizar(fen, prof) {
    return new Promise((ok, no) => {
      let cp = null, mate = null;
      const fn = s => {
        if (s.startsWith("info") && s.includes(" score ")) {
          const m = /score (cp|mate) (-?\d+)/.exec(s);
          if (m) { if (m[1] === "cp") { cp = +m[2]; mate = null; } else { mate = +m[2]; cp = null; } }
        } else if (s.startsWith("bestmove")) {
          quitar();
          ok({ cp, mate, mejor: s.split(" ")[1] || null });
        }
      };
      const quitar = () => { const i = this.oyentes.indexOf(fn); if (i >= 0) this.oyentes.splice(i, 1); };
      this.oyentes.push(fn);
      const corte = setTimeout(() => { quitar(); no(new Error("el motor no respondió")); }, 120000);
      const ok0 = ok; ok = v => { clearTimeout(corte); ok0(v); };
      this.w.postMessage("position fen " + fen);
      this.w.postMessage("go depth " + prof);
    });
  }
};

/* ============ evaluación en peones, vista desde las blancas ============ */
const TOPE = 1000; // §D regla 6: topear en ±1000 cp
function aBlancas(ev, turno) {
  let cp;
  if (ev.mate !== null && ev.mate !== undefined) cp = ev.mate > 0 ? 10000 : -10000;
  else cp = ev.cp === null ? 0 : ev.cp;
  if (turno === "b") cp = -cp;
  return Math.max(-TOPE, Math.min(TOPE, cp));
}
function textoEval(ev, turno) {
  if (ev.mate !== null && ev.mate !== undefined) {
    const n = Math.abs(ev.mate);
    const blancasGanan = (ev.mate > 0) === (turno === "w");
    return (blancasGanan ? "M" : "-M") + n;
  }
  const cp = (turno === "b" ? -ev.cp : ev.cp) || 0;
  return (cp >= 0 ? "+" : "") + (cp / 100).toFixed(2);
}

/* ============ detectores que no necesitan motor ============ */
const DIR = { w: 1, b: -1 };
function casilla(f, r) { return "abcdefgh"[f] + (r + 1); }

/* ¿algún peón rival ataca esa casilla? */
function peonAtaca(juego, sq, colorRival) {
  const f = "abcdefgh".indexOf(sq[0]), r = +sq[1] - 1;
  const dr = -DIR[colorRival];
  for (const df of [-1, 1]) {
    const ff = f + df, rr = r + dr;
    if (ff < 0 || ff > 7 || rr < 0 || rr > 7) continue;
    const p = juego.get(casilla(ff, rr));
    if (p && p.type === "p" && p.color === colorRival) return true;
  }
  return false;
}

/* ¿la pieza que quedó en `sq` se la comen gratis? */
function quedaComible(fenDespues, sq) {
  const j = new Chess(fenDespues);
  const capturas = j.moves({ verbose: true }).filter(m => m.to === sq);
  if (!capturas.length) return false;
  for (const c of capturas) {
    const j2 = new Chess(fenDespues);
    j2.move(c);
    const recupera = j2.moves({ verbose: true }).some(m => m.to === sq);
    if (!recupera) return true; // se la lleva y no hay devuelta
  }
  return false;
}

/* ============ análisis de una partida ============ */
const VALOR = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

async function analizarPartida(pgn, prof) {
  const base = new Chess();
  if (!base.load_pgn(pgn, { sloppy: true })) throw new Error("no pude leer ese PGN");
  const jugadas = base.history({ verbose: true });
  if (!jugadas.length) throw new Error("el PGN no tiene jugadas");

  // reconstruyo las posiciones
  const rep = new Chess();
  const fens = [rep.fen()];
  for (const j of jugadas) { rep.move(j); fens.push(rep.fen()); }

  await motor.arrancar();
  const evs = [];
  for (let i = 0; i < fens.length; i++) {
    estado(`Analizando posición ${i + 1} de ${fens.length}`);
    progreso(i / fens.length);
    evs.push(await motor.analizar(fens[i], prof));
  }
  progreso(1);

  const filas = [];
  for (let i = 0; i < jugadas.length; i++) {
    const j = jugadas[i];
    const turno = i % 2 === 0 ? "w" : "b";
    const antes = aBlancas(evs[i], turno);
    const despues = aBlancas(evs[i + 1], i % 2 === 0 ? "b" : "w");
    const perdida = Math.max(0, turno === "w" ? antes - despues : despues - antes) / 100;

    const senales = [];
    const jm = new Chess(fens[i]);
    const rival = turno === "w" ? "b" : "w";

    if (j.piece !== "p" && peonAtaca(jm, j.to, rival)) senales.push("va a casilla de peón");
    if (quedaComible(fens[i + 1], j.to)) senales.push("queda comible");

    // ¿había mate y se perdió?
    const eMate = evs[i].mate;
    if (eMate !== null && eMate !== undefined && eMate > 0) {
      const sig = evs[i + 1].mate;
      const sigueMate = sig !== null && sig !== undefined && sig < 0;
      if (!sigueMate) senales.push(`había mate en ${eMate}`);
    }

    // ¿la mejor era una captura y no capturó?
    const mejor = evs[i].mejor;
    if (mejor && perdida >= 1) {
      const jm2 = new Chess(fens[i]);
      const cand = jm2.moves({ verbose: true })
        .find(m => m.from === mejor.slice(0, 2) && m.to === mejor.slice(2, 4));
      if (cand) {
        if (cand.captured && !j.captured) senales.push(`mejor era comer (${cand.san})`);
        else if (cand.san !== j.san) senales.push(`mejor era ${cand.san}`);
      }
    }

    filas.push({
      n: Math.floor(i / 2) + 1, turno, san: j.san, uci: j.from + j.to,
      evalTexto: textoEval(evs[i + 1], i % 2 === 0 ? "b" : "w"),
      perdida, senales, fen: fens[i + 1], fenAntes: fens[i],
      mejor: evs[i].mejor
    });
  }
  return { filas, cabeceras: base.header() };
}

/* ============ resumen ============ */
function mediana(xs) {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function resumir(filas, turno) {
  const p = filas.filter(f => f.turno === turno).map(f => f.perdida);
  const n = p.length || 1;
  const cont = u => p.filter(u).length;
  return {
    jugadas: p.length,
    buenas: cont(x => x < 0.5) / n,
    impre: cont(x => x >= 0.5 && x < 1) / n,
    errores: cont(x => x >= 1 && x < 3) / n,
    graves: cont(x => x >= 3),
    mediana: mediana(p)
  };
}

/* ============ tablero en SVG ============ */
const GLIFO = { wk: "\u2654", wq: "\u2655", wr: "\u2656", wb: "\u2657", wn: "\u2658", wp: "\u2659",
                bk: "\u265A", bq: "\u265B", br: "\u265C", bb: "\u265D", bn: "\u265E", bp: "\u265F" };
function dibujar(fen, jugada, mejor) {
  const j = new Chess(fen);
  const b = j.board(); // fila 8 primero
  const S = 40, M = 14, T = S * 8;
  const px = sq => ("abcdefgh".indexOf(sq[0])) * S + M;
  const py = sq => (8 - +sq[1]) * S + M;
  let s = `<svg class="tab" viewBox="0 0 ${T + M * 2} ${T + M * 2}" xmlns="http://www.w3.org/2000/svg">`;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const claro = (r + f) % 2 === 0;
    s += `<rect x="${f * S + M}" y="${r * S + M}" width="${S}" height="${S}" fill="${claro ? "var(--claro)" : "var(--oscuro)"}"/>`;
  }
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const p = b[r][f];
    if (!p) continue;
    s += `<text x="${f * S + M + S / 2}" y="${r * S + M + S / 2}" font-size="${S * 0.78}"
      text-anchor="middle" dominant-baseline="central"
      fill="${p.color === "w" ? "#fff" : "#111"}" stroke="${p.color === "w" ? "#111" : "none"}"
      stroke-width="0.7">${GLIFO[p.color + p.type]}</text>`;
  }
  const flecha = (uci, color, ancho) => {
    if (!uci || uci.length < 4) return "";
    const a = uci.slice(0, 2), z = uci.slice(2, 4);
    return `<line x1="${px(a) + S / 2}" y1="${py(a) + S / 2}" x2="${px(z) + S / 2}" y2="${py(z) + S / 2}"
      stroke="${color}" stroke-width="${ancho}" stroke-linecap="round" opacity=".75"/>
      <circle cx="${px(z) + S / 2}" cy="${py(z) + S / 2}" r="6" fill="${color}" opacity=".75"/>`;
  };
  s += flecha(jugada, "#1565c0", 5);
  if (mejor && mejor !== jugada) s += flecha(mejor, "#2e7d32", 4);
  for (let f = 0; f < 8; f++)
    s += `<text x="${f * S + M + S / 2}" y="${T + M + 10}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".6">${"abcdefgh"[f]}</text>`;
  for (let r = 0; r < 8; r++)
    s += `<text x="${M - 4}" y="${r * S + M + S / 2}" font-size="10" text-anchor="end" dominant-baseline="central" fill="currentColor" opacity=".6">${8 - r}</text>`;
  return s + "</svg>";
}

/* ============ interfaz ============ */
let PARTIDAS = [], ELEGIDA = null, RESULTADO = null;

$("verPegar").onclick = () => ver("zonaPegar", $("zonaPegar").classList.contains("oculto"));

$("buscar").onclick = async () => {
  const u = $("usuario").value.trim();
  if (!u) return;
  $("buscar").disabled = true;
  ver("zonaAnalizar", false); ver("zonaResultado", false); ver("zonaPartidas", false);
  estado("");
  try {
    const r = await fetch(`https://api.chess.com/pub/player/${u}/games/archives`);
    if (!r.ok) throw new Error("no encontré ese usuario");
    const meses = (await r.json()).archives || [];
    if (!meses.length) throw new Error("ese usuario no tiene partidas públicas");
    $("meses").innerHTML = meses.slice().reverse()
      .map(m => `<option value="${m}">${m.slice(-7).replace("/", "-")}</option>`).join("");
    ver("zonaMeses", true);
    await cargarMes(meses[meses.length - 1]);
  } catch (e) {
    ver("zonaMeses", false);
    alert(e.message);
  }
  $("buscar").disabled = false;
};

$("meses").onchange = () => cargarMes($("meses").value);

async function cargarMes(url) {
  $("partidas").innerHTML = "<div>Cargando…</div>";
  ver("zonaPartidas", true);
  const j = await (await fetch(url)).json();
  PARTIDAS = (j.games || []).reverse();
  if (!PARTIDAS.length) { $("partidas").innerHTML = "<div>Ese mes no tiene partidas.</div>"; return; }
  $("partidas").innerHTML = PARTIDAS.map((g, i) => {
    const f = new Date((g.end_time || 0) * 1000).toLocaleDateString();
    const res = g.white.result === "win" ? "1-0" : g.black.result === "win" ? "0-1" : "½-½";
    return `<div data-i="${i}">${g.white.username} vs ${g.black.username} · ${res}
      <span style="opacity:.6">· ${g.time_class} · ${f}</span></div>`;
  }).join("");
  $("partidas").querySelectorAll("div[data-i]").forEach(d => {
    d.onclick = () => {
      $("partidas").querySelectorAll("div").forEach(x => x.classList.remove("sel"));
      d.classList.add("sel");
      ELEGIDA = PARTIDAS[+d.dataset.i].pgn;
      ver("zonaAnalizar", true);
      estado("");
    };
  });
}

$("usarPgn").onclick = () => {
  const t = $("pgn").value.trim();
  if (!t) return;
  ELEGIDA = t;
  ver("zonaAnalizar", true);
  estado("PGN cargado.");
};

$("analizar").onclick = async () => {
  if (!ELEGIDA) return;
  $("analizar").disabled = true;
  ver("zonaResultado", false);
  progreso(0);
  try {
    const prof = +$("prof").value;
    estado("Levantando el motor…");
    RESULTADO = await analizarPartida(ELEGIDA, prof);
    pintar(prof);
    estado("Listo.");
  } catch (e) {
    estado("No se pudo: " + e.message);
  }
  $("analizar").disabled = false;
};

function pintar(prof) {
  const { filas, cabeceras } = RESULTADO;
  const pct = x => (x * 100).toFixed(0) + "%";
  const blancas = resumir(filas, "w"), negras = resumir(filas, "b");
  $("capResumen").textContent =
    `Compara a los dos jugadores en esta partida. Profundidad ${prof}; los números de distinta profundidad no se comparan entre sí.`;
  $("resumen").innerHTML = `
    <thead><tr><th class="izq"></th><th>${cabeceras.White || "Blancas"}</th><th>${cabeceras.Black || "Negras"}</th></tr></thead>
    <tbody>
      <tr><td class="izq">Jugadas</td><td>${blancas.jugadas}</td><td>${negras.jugadas}</td></tr>
      <tr><td class="izq">Buenas (menos de 0.5)</td><td>${pct(blancas.buenas)}</td><td>${pct(negras.buenas)}</td></tr>
      <tr><td class="izq">Imprecisiones (0.5 a 1)</td><td>${pct(blancas.impre)}</td><td>${pct(negras.impre)}</td></tr>
      <tr><td class="izq">Errores (1 a 3)</td><td>${pct(blancas.errores)}</td><td>${pct(negras.errores)}</td></tr>
      <tr><td class="izq">Errores graves (3 o más)</td><td>${blancas.graves}</td><td>${negras.graves}</td></tr>
      <tr><td class="izq">Mediana de pérdida</td><td>${blancas.mediana.toFixed(2)}</td><td>${negras.mediana.toFixed(2)}</td></tr>
    </tbody>`;

  const clase = p => p >= 3 ? "grave" : p >= 1 ? "error" : p >= 0.5 ? "impre" : "";
  $("jugadas").innerHTML = `
    <thead><tr><th>N°</th><th class="izq">Jugada</th><th>Eval</th><th>Pérdida</th><th class="izq">Señales</th></tr></thead>
    <tbody>${filas.map((f, i) => `
      <tr class="jugable" data-i="${i}">
        <td>${f.n}${f.turno === "w" ? "." : "..."}</td>
        <td class="izq">${f.san}</td>
        <td>${f.evalTexto}</td>
        <td class="${clase(f.perdida)}">${f.perdida.toFixed(2)}</td>
        <td class="senal">${f.senales.join(" · ")}</td>
      </tr>`).join("")}</tbody>`;

  $("jugadas").querySelectorAll("tr[data-i]").forEach(tr => {
    tr.onclick = () => {
      $("jugadas").querySelectorAll("tr").forEach(x => x.classList.remove("sel"));
      tr.classList.add("sel");
      const f = filas[+tr.dataset.i];
      $("tablero").innerHTML = dibujar(f.fen, f.uci, f.mejor) +
        `<p class="leyenda">Azul: la jugada que se hizo (${f.san}).` +
        (f.mejor && f.mejor !== f.uci ? " Verde: la que prefería el motor." : "") + `</p>`;
      $("tablero").scrollIntoView({ block: "nearest", behavior: "smooth" });
    };
  });

  ver("zonaResultado", true);
}
</script>
</html>
