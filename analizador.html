<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analizador de partidas</title>
<style>
  :root {
    color-scheme: light dark;
    --linea: color-mix(in srgb, currentColor 20%, transparent);
    --tenue: color-mix(in srgb, currentColor 62%, transparent);
    --claro: #ded3bd; --oscuro: #9a7f5c;
    --c-brillante: #26a69a; --c-genial: #5b8def; --c-mejor: #4a9d4a;
    --c-excelente: #6bb06b; --c-bien: #86b886; --c-libro: #b08d63;
    --c-imprecision: #d4a017; --c-error: #e08030;
    --c-omision: #d0453b; --c-grave: #c0392b;
  }
  * { box-sizing: border-box; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px 14px 60px; max-width: 700px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  p.n { margin: 0 0 12px; color: var(--tenue); font-size: 14px; }
  p.cap { margin: 8px 0 2px; font-size: 12.5px; color: var(--tenue); }
  button { font: inherit; padding: 9px 15px; border: 1px solid currentColor; background: transparent;
           color: inherit; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  button.chico { padding: 5px 10px; font-size: 14px; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--linea);
    border-radius: 6px; background: transparent; color: inherit; max-width: 100%; }
  input#usuario { width: 145px; }
  textarea { width: 100%; height: 80px; font: 12px/1.4 ui-monospace, monospace; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #estado { font-weight: 600; font-size: 14px; margin: 12px 0 0; min-height: 20px; }
  .barra { height: 4px; background: var(--linea); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .barra > i { display: block; height: 100%; background: currentColor; width: 0; transition: width .15s; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  .lista { border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; margin-top: 8px; }
  .lista > div { padding: 9px 11px; border-bottom: 1px solid var(--linea); cursor: pointer; font-size: 14px; }
  .lista > div:last-child { border-bottom: 0; }
  .lista > div.sel { font-weight: 700; }
  .oculto { display: none; }

  .evalbar { height: 10px; border-radius: 5px; overflow: hidden; background: #2b2b2b;
             border: 1px solid var(--linea); margin: 10px 0 8px; }
  .evalbar > i { display: block; height: 100%; background: #f0ece2; transition: width .2s; }
  .veredicto { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
               border: 1px solid var(--linea); border-left-width: 5px; border-radius: 8px; }
  .veredicto .ico { font-weight: 800; font-size: 17px; min-width: 26px; text-align: center; }
  .veredicto .txt { flex: 1; min-width: 0; }
  .veredicto .tit { font-weight: 700; font-size: 15px; }
  .veredicto .sub { font-size: 12.5px; color: var(--tenue); }
  .veredicto .ev { font-variant-numeric: tabular-nums; font-weight: 700; }
  svg.tab { width: 100%; max-width: 360px; height: auto; display: block; margin: 10px auto 0; }
  .tira { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .tira .jugadas { flex: 1; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .tira .jugadas::-webkit-scrollbar { display: none; }
  .tira .jugadas span { display: inline-block; padding: 4px 7px; margin-right: 2px; border-radius: 5px;
                        font-size: 13.5px; cursor: pointer; }
  .tira .jugadas span.sel { outline: 2px solid currentColor; font-weight: 700; }
  .senales { font-size: 12.5px; color: var(--tenue); margin-top: 8px; min-height: 18px; }
  #diag { font: 12px/1.4 ui-monospace, monospace; color: var(--tenue); margin: 0 0 10px; }
  #errores { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
             border-left: 3px solid var(--c-grave); padding: 8px 10px; margin: 0 0 12px;
             color: var(--c-grave); }
</style>

<h1>Analizador de partidas</h1>
<p class="n">Analiza con Stockfish dentro de tu navegador. Solo sale de tu teléfono el pedido de las partidas.</p>

<!-- Este bloque es un script clásico: corre aunque el módulo falle, y por eso
     sirve para avisar que el módulo falló. -->
<div id="diag">cargando…</div>
<div id="errores" class="oculto"></div>
<script>
  window.VERSION = "v3 · 03-09";
  var diag = document.getElementById("diag");
  var caja = document.getElementById("errores");
  diag.textContent = window.VERSION + " · cargando el módulo…";
  window.mostrarError = function (donde, e) {
    var t = (e && (e.message || e.reason && e.reason.message || e.reason)) || e;
    caja.classList.remove("oculto");
    caja.textContent = (caja.textContent ? caja.textContent + "\n" : "") + donde + ": " + t;
    console.error(donde, e);
  };
  window.addEventListener("error", function (ev) {
    if (ev.target && ev.target.tagName === "SCRIPT") {
      window.mostrarError("no cargó " + (ev.target.src || "un script"),
        "el servidor lo rechazó o no existe");
    } else {
      window.mostrarError("error", ev.error || ev.message);
    }
  }, true);
  window.addEventListener("unhandledrejection", function (ev) {
    window.mostrarError("promesa rechazada", ev.reason);
  });
  setTimeout(function () {
    if (!window.MODULO_OK) {
      diag.textContent = window.VERSION + " · el módulo no arrancó";
      /* pruebo cada archivo por separado para poder nombrar el que falta */
      ["./chess.js", "./analisis.js", "./aperturas.json"].forEach(function (f) {
        fetch(f).then(function (r) {
          window.mostrarError(f, r.ok
            ? "responde " + r.status + " como " + (r.headers.get("content-type") || "sin tipo")
            : "el servidor devolvió " + r.status);
        }).catch(function (e) { window.mostrarError(f, "no se pudo pedir: " + e.message); });
      });
    }
  }, 6000);
</script>

<div class="fila">
  <input id="usuario" placeholder="usuario de chess.com" spellcheck="false" autocapitalize="off">
  <button id="buscar">Buscar</button>

</div>

<div id="zonaAnalizar" class="oculto">
  <h2>Análisis</h2>
  <div class="fila">
    <label>Profundidad
      <select id="prof">
        <option value="13">13 — rápida</option>
        <option value="16" selected>16 — recomendada</option>
        <option value="18">18 — lenta</option>
      </select>
    </label>
    <button id="analizar">Analizar</button>
  </div>

  <h2>Revisión</h2>
  <div class="evalbar"><i id="evalfill"></i></div>
  <div class="veredicto" id="veredicto">
    <div class="ico" id="vIco"></div>
    <div class="txt"><div class="tit" id="vTit"></div><div class="sub" id="vSub"></div></div>
    <div class="ev" id="vEv"></div>
  </div>
  <div id="tablero"></div>
  <div class="tira">
    <button class="chico" id="ant">&lsaquo;</button>

<script type="module">
import { Chess } from "./chess.js";
import {
  aBlancas, winPct, precisionJugada, peonAtaca, quedaComible,
  capturaGanadora, entregaMaterial, categorizar, CATEGORIAS, ORDEN
} from "./analisis.js";

window.MODULO_OK = true;
const $ = id => document.getElementById(id);
$("diag").textContent = window.VERSION + " \u00b7 listo";
const ver = (id, si) => $(id).classList.toggle("oculto", !si);

/* envuelve un manejador para que ningún error quede invisible */
const seguro = (donde, fn) => async (...a) => {
  try { return await fn(...a); }
  catch (e) { window.mostrarError(donde, e); estado("Fall\u00f3: " + (e.message || e)); }
};
const estado = t => { $("estado").textContent = t; };
const progreso = f => { $("progreso").style.width = Math.round(f * 100) + "%"; };

/* ============ motor ============ */
const motor = {
  w: null, oyentes: [],
  async arrancar() {
    if (this.w) return;
    this.w = new Worker("./stockfish-18-lite-single.js");
    this.w.onmessage = ev => {
      const d = ev.data;
      const s = typeof d === "string" ? d : String((d && d.data) || d);
      this.oyentes.slice().forEach(f => f(s));
    };
    await new Promise((ok, no) => {
      const t0 = Date.now();
      const fn = s => { if (s.startsWith("uciok")) { quitar(); clearInterval(p); ok(); } };
      const quitar = () => { const i = this.oyentes.indexOf(fn); if (i >= 0) this.oyentes.splice(i, 1); };
      this.oyentes.push(fn);
      this.w.postMessage("uci");
      const p = setInterval(() => {
        if (Date.now() - t0 > 120000) { quitar(); clearInterval(p); no(new Error("el motor no arrancó")); }
        else this.w.postMessage("uci");
      }, 700);
    });
    this.w.postMessage("setoption name MultiPV value 2");
  },
  analizar(fen, prof) {
    return new Promise((ok, no) => {
      const linea = {};
      const fn = s => {
        if (s.startsWith("info") && s.includes(" score ")) {
          const pv = /multipv (\d+)/.exec(s);
          const sc = /score (cp|mate) (-?\d+)/.exec(s);
          const mv = / pv ([a-h][1-8][a-h][1-8][qrbn]?)/.exec(s);
          if (sc) {
            const k = pv ? +pv[1] : 1;
            linea[k] = {
              cp: sc[1] === "cp" ? +sc[2] : null,
              mate: sc[1] === "mate" ? +sc[2] : null,
              mov: mv ? mv[1] : (linea[k] && linea[k].mov) || null
            };
          }
        } else if (s.startsWith("bestmove")) {
          quitar(); clearTimeout(corte);
          const uno = linea[1] || { cp: 0, mate: null, mov: null };
          ok({ cp: uno.cp, mate: uno.mate, mejor: s.split(" ")[1] || uno.mov, segunda: linea[2] || null });
        }
      };
      const quitar = () => { const i = this.oyentes.indexOf(fn); if (i >= 0) this.oyentes.splice(i, 1); };
      this.oyentes.push(fn);
      const corte = setTimeout(() => { quitar(); no(new Error("el motor no respondió")); }, 120000);
      this.w.postMessage("position fen " + fen);
      this.w.postMessage("go depth " + prof);
    });
  }
};

/* ============ aperturas ============ */
let LIBRO = null;
async function cargarLibro() {
  if (LIBRO) return LIBRO;
  try {
    const d = await (await fetch("./aperturas.json")).json();
    LIBRO = { pos: new Set(d.posiciones), nombres: d.nombres };
  } catch { LIBRO = { pos: new Set(), nombres: {} }; }
  return LIBRO;
}
const claveLibro = fen => fen.split(" ").slice(0, 4).join(" ");

/* ============ análisis ============ */
function textoEval(ev, turno) {
  if (ev.mate !== null && ev.mate !== undefined) {
    const blancasGanan = (ev.mate > 0) === (turno === "w");
    return (blancasGanan ? "M" : "-M") + Math.abs(ev.mate);
  }
  const cp = turno === "b" ? -(ev.cp || 0) : (ev.cp || 0);
  return (cp >= 0 ? "+" : "") + (cp / 100).toFixed(2);
}

async function analizarPartida(pgn, prof) {
  const base = new Chess();
  if (!base.load_pgn(pgn, { sloppy: true })) throw new Error("no pude leer ese PGN");
  const jugadas = base.history({ verbose: true });
  if (!jugadas.length) throw new Error("el PGN no tiene jugadas");

  const libro = await cargarLibro();
  const rep = new Chess();
  const fens = [rep.fen()];
  for (const j of jugadas) { rep.move(j); fens.push(rep.fen()); }

  await motor.arrancar();
  const evs = [];
  for (let i = 0; i < fens.length; i++) {
    estado(`Analizando posición ${i + 1} de ${fens.length}`);
    progreso(i / fens.length);
    evs.push(await motor.analizar(fens[i], prof));
  }
  progreso(1);

  let apertura = "";
  const filas = [];
  for (let i = 0; i < jugadas.length; i++) {
    const j = jugadas[i];
    const turno = i % 2 === 0 ? "w" : "b";
    const rival = turno === "w" ? "b" : "w";
    const antes = aBlancas(evs[i], turno);
    const despues = aBlancas(evs[i + 1], rival);
    const perdida = Math.max(0, turno === "w" ? antes - despues : despues - antes) / 100;

    const wAntes = turno === "w" ? winPct(antes) : 100 - winPct(antes);
    const wDespues = turno === "w" ? winPct(despues) : 100 - winPct(despues);
    const precision = precisionJugada(Math.max(0, wAntes - wDespues));

    const uci = j.from + j.to + (j.promotion || "");
    const esMejor = evs[i].mejor === uci;
    const clave = claveLibro(fens[i + 1]);
    const esLibro = libro.pos.has(clave);
    if (esLibro && libro.nombres[clave]) apertura = libro.nombres[clave];

    let unicaBuena = false;
    if (evs[i].segunda) {
      const a1 = aBlancas(evs[i], turno);
      const a2 = aBlancas({ cp: evs[i].segunda.cp, mate: evs[i].segunda.mate }, turno);
      unicaBuena = Math.abs(a1 - a2) >= 150;
    }
    const legales = new Chess(fens[i]).moves().length;

    let oportunidad = null;
    const eMate = evs[i].mate;
    if (eMate !== null && eMate !== undefined && eMate > 0) {
      const sig = evs[i + 1].mate;
      if (!(sig !== null && sig !== undefined && sig < 0)) oportunidad = { tipo: "mate", n: eMate };
    }
    if (!oportunidad && !j.captured) {
      const c = capturaGanadora(fens[i]);
      if (c) oportunidad = { tipo: "material", san: c.san, gana: c.gana };
    }

    const entrega = esMejor
      ? entregaMaterial(fens[i], { from: j.from, to: j.to, promotion: j.promotion })
      : false;
    const cat = categorizar({ perdida, esMejor, esLibro, entrega, unicaBuena, oportunidad, legales });

    const senales = [];
    if (perdida >= 0.5) {
      const jm = new Chess(fens[i]);
      if (j.piece !== "p" && peonAtaca(jm, j.to, rival)) senales.push("fue a una casilla atacada por un peón");
      if (quedaComible(fens[i + 1], j.to)) senales.push("la pieza movida queda comible");
    }
    if (oportunidad) {
      senales.push(oportunidad.tipo === "mate"
        ? `había mate forzado en ${oportunidad.n}`
        : `había ${oportunidad.san}, que ganaba ${oportunidad.gana}`);
    }

    filas.push({
      n: Math.floor(i / 2) + 1, turno, san: j.san, uci, cat, perdida, precision,
      evalBlancas: despues, evalTexto: textoEval(evs[i + 1], rival),
      fen: fens[i + 1], mejor: evs[i].mejor, senales,
      franja: (turno === "w" ? antes : -antes) / 100
    });
  }
  return { filas, cab: base.header(), apertura };
}

/* ============ tablero ============ */
const FORMA = { k: "\u2654", q: "\u2655", r: "\u2656", b: "\u2657", n: "\u2658", p: "\u2659" };
let GIRADO = false;
function dibujar(fen, jugada, mejor) {
  const b = new Chess(fen).board();
  const S = 42, M = 15, T = S * 8;
  const fx = f => (GIRADO ? 7 - f : f) * S + M;
  const ry = r => (GIRADO ? 7 - r : r) * S + M;
  const cx = sq => fx("abcdefgh".indexOf(sq[0])) + S / 2;
  const cy = sq => ry(8 - +sq[1]) + S / 2;
  let s = `<svg class="tab" viewBox="0 0 ${T + M * 2} ${T + M * 2}" xmlns="http://www.w3.org/2000/svg">`;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++)
    s += `<rect x="${fx(f)}" y="${ry(r)}" width="${S}" height="${S}" fill="${(r + f) % 2 === 0 ? "var(--claro)" : "var(--oscuro)"}"/>`;
  /* misma silueta para los dos bandos: el bando se distingue por el relleno */
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const p = b[r][f];
    if (!p) continue;
    s += `<text x="${fx(f) + S / 2}" y="${ry(r) + S / 2}" font-size="${S * 0.8}"
      text-anchor="middle" dominant-baseline="central" font-family="serif"
      fill="${p.color === "w" ? "#ffffff" : "#1a1a1a"}"
      stroke="${p.color === "w" ? "#1a1a1a" : "#e8e8e8"}" stroke-width="1"
      paint-order="stroke">${FORMA[p.type]}</text>`;
  }
  const flecha = (uci, color, ancho) => {
    if (!uci || uci.length < 4) return "";
    const a = uci.slice(0, 2), z = uci.slice(2, 4);
    return `<line x1="${cx(a)}" y1="${cy(a)}" x2="${cx(z)}" y2="${cy(z)}" stroke="${color}"
      stroke-width="${ancho}" stroke-linecap="round" opacity=".8"/>
      <circle cx="${cx(z)}" cy="${cy(z)}" r="7" fill="${color}" opacity=".8"/>`;
  };
  s += flecha(jugada, "#1565c0", 5);
  if (mejor) s += flecha(mejor, "#2e7d32", 4);
  for (let f = 0; f < 8; f++)
    s += `<text x="${fx(f) + S / 2}" y="${T + M + 10}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".55">${"abcdefgh"[f]}</text>`;
  for (let r = 0; r < 8; r++)
    s += `<text x="${M - 4}" y="${ry(r) + S / 2}" font-size="10" text-anchor="end" dominant-baseline="central" fill="currentColor" opacity=".55">${8 - r}</text>`;
  return s + "</svg>";
}

/* ============ interfaz ============ */
let PARTIDAS = [], ELEGIDA = null, R = null, IDX = 0, VER_MEJOR = false, USUARIO = "";

$("verPegar").onclick = () => ver("zonaPegar", $("zonaPegar").classList.contains("oculto"));

$("buscar").onclick = seguro("buscar", async () => {
  const u = $("usuario").value.trim();
  if (!u) return;
  USUARIO = u.toLowerCase();
  $("buscar").disabled = true;
  ["zonaAnalizar", "zonaRevision", "zonaResumen", "zonaPartidas"].forEach(z => ver(z, false));
  try {
    const r = await fetch(`https://api.chess.com/pub/player/${u}/games/archives`);
    if (!r.ok) throw new Error("no encontré ese usuario");
    const meses = (await r.json()).archives || [];
    if (!meses.length) throw new Error("ese usuario no tiene partidas públicas");
    $("meses").innerHTML = meses.slice().reverse()
      .map(m => `<option value="${m}">${m.slice(-7).replace("/", "-")}</option>`).join("");
    ver("zonaMeses", true);
    await cargarMes(meses[meses.length - 1]);
  } catch (e) { ver("zonaMeses", false); window.mostrarError("buscar", e); estado(e.message); }
  $("buscar").disabled = false;
});

$("meses").onchange = seguro("mes", () => cargarMes($("meses").value));

async function cargarMes(url) {
  $("partidas").innerHTML = "<div>Cargando…</div>";
  ver("zonaPartidas", true);
  const j = await (await fetch(url)).json();
  PARTIDAS = (j.games || []).reverse();
  if (!PARTIDAS.length) { $("partidas").innerHTML = "<div>Ese mes no tiene partidas.</div>"; return; }
  $("partidas").innerHTML = PARTIDAS.map((g, i) => {
    const f = new Date((g.end_time || 0) * 1000).toLocaleDateString();
    const res = g.white.result === "win" ? "1-0" : g.black.result === "win" ? "0-1" : "\u00bd-\u00bd";
    return `<div data-i="${i}">${g.white.username} vs ${g.black.username} \u00b7 ${res}
      <span style="opacity:.6">\u00b7 ${g.time_class} \u00b7 ${f}</span></div>`;
  }).join("");
  $("partidas").querySelectorAll("div[data-i]").forEach(d => {
    d.onclick = () => {
      $("partidas").querySelectorAll("div").forEach(x => x.classList.remove("sel"));
      d.classList.add("sel");
      ELEGIDA = PARTIDAS[+d.dataset.i].pgn;
      ver("zonaAnalizar", true);
      estado("");
    };
  });
}

$("usarPgn").onclick = seguro("pgn", () => {
  const t = $("pgn").value.trim();
  if (!t) return;
  ELEGIDA = t; ver("zonaAnalizar", true); estado("PGN cargado.");
});

$("analizar").onclick = seguro("analizar", async () => {
  if (!ELEGIDA) return;
  $("analizar").disabled = true;
  ver("zonaRevision", false); ver("zonaResumen", false);
  progreso(0);
  try {
    const prof = +$("prof").value;
    estado("Levantando el motor\u2026");
    R = await analizarPartida(ELEGIDA, prof);
    IDX = 0;
    GIRADO = !!USUARIO && (R.cab.Black || "").toLowerCase() === USUARIO;
    pintarResumen(prof);
    pintarRevision();
    ver("zonaRevision", true); ver("zonaResumen", true);
    estado(R.apertura ? `Listo. Apertura: ${R.apertura}` : "Listo.");
  } catch (e) {
    estado("No se pudo: " + e.message);
  }
  $("analizar").disabled = false;
});

function pintarRevision() {
  const f = R.filas[IDX];
  const c = CATEGORIAS[f.cat];
  const color = `var(--c-${f.cat})`;
  $("veredicto").style.borderLeftColor = color;
  $("vIco").textContent = c.icono;
  $("vIco").style.color = color;
  $("vTit").textContent = `${f.n}${f.turno === "w" ? "." : "..."} ${f.san} \u2014 ${c.nombre}`;
  $("vSub").textContent = c.desc;
  $("vEv").textContent = f.evalTexto;

  $("evalfill").style.width = Math.max(2, Math.min(98, winPct(f.evalBlancas))) + "%";
  $("tablero").innerHTML = dibujar(f.fen, f.uci, VER_MEJOR && f.mejor !== f.uci ? f.mejor : null);

  $("tira").innerHTML = R.filas.map((x, i) =>
    `<span data-i="${i}" class="${i === IDX ? "sel" : ""}" style="color:var(--c-${x.cat})">${x.turno === "w" ? x.n + "." : ""}${x.san}</span>`).join("");
  $("tira").querySelectorAll("span[data-i]").forEach(s => {
    s.onclick = () => { IDX = +s.dataset.i; pintarRevision(); };
  });
  const sel = $("tira").querySelector(".sel");
  if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });

  $("senales").textContent = f.senales.length ? "\u00b7 " + f.senales.join(" \u00b7 ") : "";
  $("btnMejor").textContent = VER_MEJOR ? "Ocultar la mejor" : "Mostrar la mejor";
  $("ant").disabled = IDX === 0;
  $("sig").disabled = IDX === R.filas.length - 1;
}
$("ant").onclick = seguro("anterior", () => { if (IDX > 0) { IDX--; pintarRevision(); } });
$("sig").onclick = seguro("siguiente", () => { if (IDX < R.filas.length - 1) { IDX++; pintarRevision(); } });
$("btnMejor").onclick = seguro("mejor", () => { VER_MEJOR = !VER_MEJOR; pintarRevision(); });
$("btnGirar").onclick = seguro("girar", () => { GIRADO = !GIRADO; pintarRevision(); });

function mediana(xs) {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function pintarResumen(prof) {
  const { filas, cab } = R;
  const B = filas.filter(f => f.turno === "w"), N = filas.filter(f => f.turno === "b");
  const prec = fs => fs.length ? fs.reduce((a, x) => a + x.precision, 0) / fs.length : 0;

  $("capResumen").textContent =
    `Compara a los dos jugadores. Profundidad ${prof}; los n\u00fameros de distinta profundidad no se comparan.`;

  const filaCat = k => `<tr><td><span style="color:var(--c-${k})">${CATEGORIAS[k].icono}</span> ${CATEGORIAS[k].nombre}</td>` +
    `<td>${B.filter(f => f.cat === k).length}</td><td>${N.filter(f => f.cat === k).length}</td></tr>`;

  $("resumen").innerHTML = `
    <thead><tr><th></th><th>${cab.White || "Blancas"}</th><th>${cab.Black || "Negras"}</th></tr></thead>
    <tbody>
      <tr><td><b>Precisi\u00f3n</b></td><td><b>${prec(B).toFixed(1)}</b></td><td><b>${prec(N).toFixed(1)}</b></td></tr>
      <tr><td>Mediana de p\u00e9rdida</td><td>${mediana(B.map(f => f.perdida)).toFixed(2)}</td>
          <td>${mediana(N.map(f => f.perdida)).toFixed(2)}</td></tr>
      ${ORDEN.map(filaCat).join("")}
    </tbody>`;

  const FR = [["menos de +2", x => x < 2], ["+2 a +5", x => x >= 2 && x < 5],
              ["+5 a +8", x => x >= 5 && x < 8], ["+8 o m\u00e1s", x => x >= 8]];
  const cuenta = (fs, test) => {
    const en = fs.filter(f => test(f.franja));
    return en.length ? `${en.filter(f => f.perdida >= 3).length} de ${en.length}` : "\u2014";
  };
  $("capFranja").textContent =
    "Compara situaciones, no jugadas: cu\u00e1ntas jugadas malas salieron de cada nivel de ventaja del que mov\u00eda.";
  $("franja").innerHTML = `
    <thead><tr><th>Ventaja antes de mover</th><th>${cab.White || "Blancas"}</th><th>${cab.Black || "Negras"}</th></tr></thead>
    <tbody>${FR.map(([n, t]) => `<tr><td>${n}</td><td>${cuenta(B, t)}</td><td>${cuenta(N, t)}</td></tr>`).join("")}</tbody>`;
}
</script>
</html>
